# .github/ISSUE_TEMPLATE/feature_request.yml is the GitHub issue form for feature requests.
# It asks for the problem first, so larger changes are discussed before any code is written.
name: Feature request
description: Propose a new capability or a change to existing behavior
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should Pace behave? Name the CLI command, menu or MCP tool it affects.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I checked the documentation and existing issues for this request.
          required: true
